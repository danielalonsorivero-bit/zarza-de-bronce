<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Zarza de Bronce</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:auto;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
'use strict';
const C=document.getElementById('c'),g=C.getContext('2d');
const W=1280,H=720,FLOOR=648,LEFT=70,RIGHT=1210,STAT_Y=292;
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=t=>t*t*(3-2*t),rnd=(a,b)=>a+Math.random()*(b-a);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

/* ---------------- ENTRADA ---------------- */
const keys={},edge={};let lastDev='kb',padName='';
const KMAP={Space:'roll',KeyJ:'light',KeyZ:'light',KeyK:'heavy',KeyX:'heavy',KeyE:'heal',KeyC:'heal',Enter:'start',Escape:'pause',KeyP:'pause'};
addEventListener('keydown',e=>{
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  if(e.repeat)return;keys[e.code]=true;lastDev='kb';
  const a=KMAP[e.code];if(a)edge[a]=true;if(e.code==='Space')edge.start=true;
});
addEventListener('keyup',e=>{keys[e.code]=false});
C.addEventListener('mousedown',e=>{lastDev='kb';edge[e.button===2?'heavy':'light']=true});
C.addEventListener('contextmenu',e=>e.preventDefault());
const inp={move:0};let prevB=[];
function getPad(){const ps=navigator.getGamepads?navigator.getGamepads():[];for(const p of ps)if(p&&p.connected)return p;return null}
function pollInput(){
  let m=0;
  if(keys.KeyA||keys.ArrowLeft)m-=1;if(keys.KeyD||keys.ArrowRight)m+=1;
  const gp=getPad();
  if(gp){
    padName=gp.id;
    const b=gp.buttons.map(x=>x.pressed||x.value>.5),pr=i=>b[i]&&!prevB[i];
    const ax=gp.axes[0]||0;
    let pm=Math.abs(ax)>.3?Math.sign(ax):0;if(b[14])pm=-1;if(b[15])pm=1;
    if(pm){m=pm;lastDev='pad'}
    if(b.some(Boolean))lastDev='pad';
    if(pr(1)||pr(0))edge.roll=true;
    if(pr(5)||pr(2))edge.light=true;
    if(pr(7)||pr(3))edge.heavy=true;
    if(pr(4)||pr(12))edge.heal=true;
    if(pr(9)||pr(0))edge.start=true;
    if(pr(9))edge.pause=true;
    prevB=b;
  }else padName='';
  inp.move=m;
}
function rumble(ms,strong,weak){const gp=getPad();try{gp&&gp.vibrationActuator&&gp.vibrationActuator.playEffect&&gp.vibrationActuator.playEffect('dual-rumble',{duration:ms,strongMagnitude:strong,weakMagnitude:weak}).catch(()=>{})}catch(e){}}

/* ---------------- AUDIO ---------------- */
let AC,master,noiseBuf,droneG;
function audioInit(){
  if(AC){AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  droneG=AC.createGain();droneG.gain.value=0;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;
  for(const fr of[55,55.6,82.4,110.3]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start()}
  f.connect(droneG).connect(master);
}
function tone(f,d,type,v,f2,delay){if(!AC)return;const n=AC.currentTime+(delay||0),o=AC.createOscillator(),ga=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
  ga.gain.setValueAtTime(v||.2,n);ga.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(ga).connect(master);o.start(n);o.stop(n+d+.02)}
function noise(d,v,fc,type){if(!AC)return;const n=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),ga=AC.createGain();
  s.buffer=noiseBuf;s.loop=true;f.type=type||'lowpass';f.frequency.value=fc||1500;ga.gain.setValueAtTime(v||.2,n);ga.gain.exponentialRampToValueAtTime(.001,n+d);
  s.connect(f).connect(ga).connect(master);s.start(n,Math.random()*.5);s.stop(n+d+.02)}
const SFX={
  swing:()=>noise(.14,.14,3200,'bandpass'),
  heavy:()=>noise(.22,.2,1800,'bandpass'),
  hit:()=>{noise(.12,.35,2500,'highpass');tone(520,.18,'triangle',.22,180);tone(1900,.25,'sine',.06,1500)},
  roll:()=>noise(.25,.12,700),
  hurt:()=>{noise(.2,.4,900);tone(140,.3,'square',.18,60)},
  slam:()=>{tone(90,.6,'sine',.6,28);noise(.5,.5,500)},
  whoosh:()=>noise(.35,.3,900,'bandpass'),
  thorn:()=>{noise(.2,.3,3000,'highpass');tone(300,.2,'sawtooth',.1,90)},
  warn:()=>tone(880,.25,'sine',.05,660),
  heal:()=>{tone(440,.5,'sine',.15,880);tone(660,.5,'sine',.1,1320,.1)},
  roar:()=>{tone(110,1.4,'sawtooth',.3,45);noise(1.3,.3,600)},
  die:()=>{tone(220,2,'sine',.3,40);noise(1.5,.2,400)},
  win:()=>{[220,277,330,440].forEach((f,i)=>tone(f,3,'sine',.14,0,i*.12))},
  drum:()=>{tone(70,.35,'sine',.35,38)}
};

/* ---------------- ESCENARIO ---------------- */
function sculpt(c,glow){
  const r=rng(11),segs=[];
  function br(x,y,a,len,w,d,side){
    for(let i=0;i<3;i++){const nx=x+Math.cos(a)*len/3,ny=y+Math.sin(a)*len/3;segs.push([x,y,nx,ny,w]);x=nx;y=ny;
      a+=(r()-.5)*.75;const tgt=side>0?-.2:-Math.PI+.2;a=lerp(a,tgt,.12);w*=.87}
    if(d>0){const n=1+(r()<.65?1:0)+(r()<.25?1:0);for(let k=0;k<n;k++)br(x,y,a+(r()-.5)*1.2,len*(.6+r()*.3),w*.8,d-1,side)}
  }
  for(let i=0;i<58;i++){const sx=240+i/57*800,side=sx<640?-1:1,off=Math.abs(sx-640)/400;
    const up=.3+(1-off)*.95+r()*.3;const a=side>0?-up:-(Math.PI-up);
    br(sx,575-r()*50,a,140+r()*120,19+r()*11,3,side)}
  c.lineCap='round';
  if(glow){c.shadowColor='#ff6a10';c.shadowBlur=14;c.strokeStyle='rgba(255,130,40,.7)';
    for(const s of segs){c.lineWidth=Math.max(1,s[4]*.22);c.beginPath();c.moveTo(s[0],s[1]);c.lineTo(s[2],s[3]);c.stroke()}
    c.shadowBlur=0;return}
  const pass=(col,k,ox,oy,add)=>{c.strokeStyle=col;for(const s of segs){c.lineWidth=Math.max(1,s[4]*k+add);c.beginPath();c.moveTo(s[0]+ox,s[1]+oy);c.lineTo(s[2]+ox,s[3]+oy);c.stroke()}};
  pass('rgba(60,40,15,.35)',1,10,12,4);            // sombra sobre la cortina
  pass('#24170a',1,0,0,4);pass('#6b4e25',1,0,0,0);pass('#a5824a',.38,-1,-2,0);pass('#d8b877',.12,-2,-3,0);
  // masa inferior de zarzas y bultos
  for(let i=0;i<300;i++){const x=640+(r()+r()+r()-1.5)*560,y=455+r()*135,rad=7+r()*15;
    c.fillStyle=r()<.5?'#2a1b0c':'#5d4320';c.beginPath();c.ellipse(x,y,rad*(1+r()*.6),rad,r()*3,0,7);c.fill();
    c.fillStyle='rgba(190,150,85,.5)';c.beginPath();c.ellipse(x-rad*.3,y-rad*.35,rad*.35,rad*.2,0,0,7);c.fill()}
  // tronco central
  const tg=c.createLinearGradient(600,0,680,0);tg.addColorStop(0,'#2a1b0c');tg.addColorStop(.45,'#9a7840');tg.addColorStop(1,'#3a2812');
  c.fillStyle=tg;c.beginPath();c.moveTo(585,590);c.quadraticCurveTo(622,430,626,STAT_Y);c.lineTo(656,STAT_Y);c.quadraticCurveTo(660,430,700,590);c.fill();
}
function buildBG(){
  const b=document.createElement('canvas');b.width=W;b.height=H;const c=b.getContext('2d');
  // madera
  let gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5b3216');gr.addColorStop(1,'#3a1e0c');c.fillStyle=gr;c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=2;for(let x=8;x<W;x+=22){c.beginPath();c.moveTo(x,0);c.lineTo(x,600);c.stroke()}
  // cortina
  gr=c.createLinearGradient(0,20,0,600);gr.addColorStop(0,'#bfa77c');gr.addColorStop(.5,'#d3bf98');gr.addColorStop(1,'#a8926b');
  c.fillStyle=gr;c.fillRect(58,18,1062,582);
  const r=rng(3);for(let x=58;x<1120;x+=14+r()*14){const w=6+r()*10;const fg=c.createLinearGradient(x,0,x+w,0);
    fg.addColorStop(0,'rgba(90,65,35,.0)');fg.addColorStop(.5,'rgba(90,65,35,.22)');fg.addColorStop(1,'rgba(255,240,210,.12)');c.fillStyle=fg;c.fillRect(x,18,w,582)}
  c.fillStyle='rgba(60,40,20,.25)';c.fillRect(58,18,1062,10);
  // techo
  c.fillStyle='#2c170a';c.fillRect(0,0,W,18);c.fillStyle='#7a4a22';c.fillRect(0,14,W,4);
  // foco
  gr=c.createRadialGradient(640,260,60,640,300,620);gr.addColorStop(0,'rgba(255,235,190,.28)');gr.addColorStop(1,'rgba(255,235,190,0)');c.fillStyle=gr;c.fillRect(0,0,W,600);
  sculpt(c,false);
  c.fillStyle='rgba(20,10,0,.3)';c.fillRect(0,18,W,574);
  // suelo de mármol
  gr=c.createLinearGradient(0,592,0,H);gr.addColorStop(0,'#f4efe4');gr.addColorStop(.12,'#ddd5c6');gr.addColorStop(1,'#9d9484');c.fillStyle=gr;c.fillRect(0,592,W,H-592);
  c.fillStyle='#fffaf0';c.fillRect(0,592,W,4);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(0,596,W,3);
  c.strokeStyle='rgba(120,110,95,.25)';c.lineWidth=1;for(let i=0;i<40;i++){let x=r()*W,y=604+r()*110;c.beginPath();c.moveTo(x,y);for(let k=0;k<4;k++){x+=20+r()*50;y+=(r()-.5)*10;c.lineTo(x,y)}c.stroke()}
  // sitial vacío y alabardas
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(742,594,40,6,0,0,7);c.fill();
  c.fillStyle='#f3efe6';c.strokeStyle='#b9b09c';c.lineWidth=2;
  c.beginPath();c.roundRect(716,508,52,86,[18,18,4,4]);c.fill();c.stroke();c.beginPath();c.roundRect(708,556,68,38,6);c.fill();c.stroke();
  for(const x of[196,1176]){c.strokeStyle='#3a2a18';c.lineWidth=4;c.beginPath();c.moveTo(x,594);c.lineTo(x,452);c.stroke();
    c.fillStyle='#c9c9c9';c.beginPath();c.moveTo(x,430);c.lineTo(x+7,456);c.lineTo(x-7,456);c.fill();c.beginPath();c.moveTo(x-12,458);c.quadraticCurveTo(x,470,x+12,458);c.lineTo(x,464);c.fill()}
  return b;
}
function buildGlow(){const b=document.createElement('canvas');b.width=W;b.height=H;sculpt(b.getContext('2d'),true);return b}
function buildVig(){const b=document.createElement('canvas');b.width=W;b.height=H;const c=b.getContext('2d');
  const gr=c.createRadialGradient(W/2,H/2+40,260,W/2,H/2,820);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.78)');c.fillStyle=gr;c.fillRect(0,0,W,H);return b}
const BG=buildBG(),GLOW=buildGlow(),VIG=buildVig();

/* ---------------- ESTADO ---------------- */
const BOSS_HP=560;
const ATK={sweep:{wind:.55,act:.16,rec:.5},slam:{wind:.8,act:.14,rec:.85},leap:{wind:.45,act:.75,rec:.8},thorns:{wind:.85,act:.2,rec:.7}};
let G={state:'title',t:0,paused:false},player,boss,haz=[],parts=[],time=0,freeze=0,shake=0,drumT=0,lanceT=5;
function reset(){
  player={x:330,vx:0,face:1,hp:100,hpLag:100,st:100,stDelay:0,flasks:4,state:'idle',t:0,inv:0,buf:null,bufT:0,hitDone:false,healed:false,walk:0};
  boss={x:640,y:STAT_Y-FLOOR,vy:0,sc:.75,face:-1,hp:BOSS_HP,hpLag:BOSS_HP,state:'statue',t:0,phase:1,cd:1,queue:[],hit:false,wm:1,walk:0,poise:0,flash:0,dmgShow:0,dmgT:0,sx:0,tx:0,seen:false};
  haz=[];parts=[];G={state:'intro',t:0,paused:false};lanceT=5;
}
reset();G.state='title';
function setB(s){boss.state=s;boss.t=0;boss.hit=false}

/* ---------------- PARTÍCULAS ---------------- */
function burst(x,y,n,col,spd,o){o=o||{};for(let i=0;i<n;i++){const a=o.up?-Math.PI/2+rnd(-1.2,1.2):rnd(0,6.28),s=rnd(.3,1)*spd;
  parts.push({x:x+rnd(-1,1)*(o.spread||0),y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:rnd(.3,.9)*(o.life||1),col,size:rnd(1.5,4)*(o.size||1),grav:o.grav==null?900:o.grav,glow:o.glow})}}
function updParts(dt){for(const p of parts){p.life+=dt;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.grav>0&&p.y>FLOOR+6){p.y=FLOOR+6;p.vy*=-.3;p.vx*=.6}}
  parts=parts.filter(p=>p.life<p.max);if(parts.length>700)parts.splice(0,parts.length-700)}

/* ---------------- JUGADOR ---------------- */
function hurtPlayer(dmg,fromX){
  const p=player;if(p.state==='dead'||p.inv>0||(p.state==='roll'&&p.t<.36))return false;
  p.hp-=dmg;p.state='hurt';p.t=0;p.inv=.75;p.vx=Math.sign(p.x-fromX||1)*380;p.buf=null;
  shake=Math.max(shake,12);freeze=.08;SFX.hurt();rumble(250,1,.6);burst(p.x,FLOOR-40,14,'#b01818',300,{life:.8});
  if(p.hp<=0){p.hp=0;p.state='dead';p.t=0;G.state='dead';G.t=0;SFX.die();rumble(700,1,1)}
  return true;
}
function hitBoss(dmg,poise){
  const b=boss;if(b.state==='stagger')dmg=Math.round(dmg*1.35);
  b.hp-=dmg;b.flash=.12;b.poise+=poise;b.dmgShow+=dmg;b.dmgT=2;freeze=.07;shake=Math.max(shake,5+dmg*.15);SFX.hit();rumble(90,.3,.7);
  burst(lerp(player.x,b.x,.6),FLOOR-70+rnd(-20,20),14,'#ffd27a',420,{glow:true,life:.7});
  if(b.hp<=0){b.hp=0;setB('dying');haz=[];b.queue=[];SFX.die();return}
  if(b.poise>=100&&!['leap','phase','fall','roar','stagger'].includes(b.state)){b.poise=0;b.queue=[];setB('stagger');SFX.slam();burst(b.x,FLOOR-120,30,'#ffd27a',500,{glow:true})}
}
function updPlayer(dt){
  const p=player,b=boss;p.t+=dt;p.inv=Math.max(0,p.inv-dt);p.hpLag=Math.max(p.hp,p.hpLag-dt*40);
  if(p.state==='dead'){p.vx*=.9;p.x=clamp(p.x+p.vx*dt,LEFT,RIGHT);return}
  for(const a of['roll','light','heavy','heal'])if(edge[a]){p.buf=a;p.bufT=.3}
  p.bufT-=dt;if(p.bufT<=0)p.buf=null;
  const m=inp.move,free=p.state==='idle';
  const start=a=>{
    const toB=Math.sign(b.x-p.x)||1;
    if(a==='roll'&&p.st>0){p.st-=24;p.state='roll';if(m)p.face=m;SFX.roll()}
    else if(a==='light'&&p.st>0){p.st-=17;p.state='light';p.face=m||toB;SFX.swing()}
    else if(a==='heavy'&&p.st>0){p.st-=32;p.state='heavy';p.face=m||toB}
    else if(a==='heal'&&p.flasks>0&&p.hp<100){p.state='heal';p.healed=false}
    else return false;
    p.t=0;p.hitDone=false;p.stDelay=.7;p.buf=null;return true;
  };
  if(free){ if(!(p.buf&&start(p.buf))){p.vx=m*265;if(m){p.face=m;p.walk+=dt*13}} }
  const tryHit=(reach,dmg,poise)=>{
    if(p.hitDone)return;const cx=p.x+p.face*reach/2;
    if(!['statue','fall','dying'].includes(b.state)&&b.y>-110&&Math.abs(b.x-cx)<reach/2+44){p.hitDone=true;hitBoss(dmg,poise)}
  };
  switch(p.state){
    case 'roll':p.vx=p.face*540*(1-p.t/.5*.55);if(p.t>.5)p.state='idle';break;
    case 'light':p.vx=p.t<.14?p.face*130:0;if(p.t>.1&&p.t<.22)tryHit(104,15,13);
      if(p.t>.27&&p.buf==='light'&&p.st>0){start('light')}else if(p.t>.38)p.state='idle';break;
    case 'heavy':p.vx=(p.t>.36&&p.t<.5)?p.face*190:0;if(p.t>.4&&!p.hitDone&&p.t<.42)SFX.heavy();
      if(p.t>.42&&p.t<.55)tryHit(124,36,36);if(p.t>.82)p.state='idle';break;
    case 'heal':p.vx=m*55;if(p.t>.55&&!p.healed){p.healed=true;p.flasks--;p.hp=Math.min(100,p.hp+48);SFX.heal();burst(p.x,FLOOR-50,22,'#ffb347',160,{up:true,grav:-200,glow:true,life:1.2})}
      if(p.t>.95)p.state='idle';break;
    case 'hurt':p.vx*=Math.pow(.02,dt);if(p.t>.38)p.state='idle';break;
  }
  p.x+=p.vx*dt;
  if(p.state!=='roll'&&b.y>-60&&!['statue','fall','dying'].includes(b.state)&&Math.abs(p.x-b.x)<46)p.x=b.x+(Math.sign(p.x-b.x)||1)*46;
  p.x=clamp(p.x,LEFT,RIGHT);
  p.stDelay-=dt;if(p.state==='idle'&&p.stDelay<=0)p.st=Math.min(100,p.st+48*dt);if(p.st<0)p.st=Math.max(p.st,-20);
}

/* ---------------- JEFE ---------------- */
function choose(){
  const b=boss,d=Math.abs(player.x-b.x),r=Math.random(),p2=b.phase===2;let q=null;
  if(d<240){
    if(p2)q=r<.38?['sweep','sweep','slam']:r<.62?['slam']:r<.82?['sweep','thorns']:['leap'];
    else q=r<.48?['sweep']:r<.78?['slam']:r<.92?['sweep','sweep']:['thorns'];
  }else if(d<480){if(r<.42)q=['leap'];else if(r<.72)q=['thorns'];else if(p2&&r<.86)q=['leap','sweep']}
  else q=r<.5?['leap']:['thorns'];
  if(!q){b.cd=.45;return}
  b.queue=q;nextAtk(1);
}
function nextAtk(wm){const b=boss;setB(b.queue.shift());b.wm=wm*(b.phase===2?.82:1);b.face=Math.sign(player.x-b.x)||b.face}
function wave(x,dir){haz.push({type:'wave',x,dir,t:0})}
function updBoss(dt){
  const b=boss,p=player;b.t+=dt;b.flash=Math.max(0,b.flash-dt);b.hpLag=Math.max(b.hp,b.hpLag-dt*120);
  b.dmgT-=dt;if(b.dmgT<=0)b.dmgShow=0;b.poise=Math.max(0,b.poise-dt*6);
  const dx=p.x-b.x,dist=Math.abs(dx),t=b.t,A=ATK[b.state],alive=p.state!=='dead';
  if(A){
    const w=A.wind*b.wm,f=b.face;
    if(t<w){if(t<w*.6&&b.state!=='leap')b.face=Math.sign(dx)||f}
    else if(t<w+A.act){
      const first=!b.hit;b.hit=true;
      if(b.state==='sweep'){b.x+=f*320*dt;if(first){SFX.whoosh()}
        const rel=(p.x-b.x)*f;if(rel>-30&&rel<245&&!b.hit2){if(hurtPlayer(22,b.x))b.hit2=true}}
      if(b.state==='slam'&&first){SFX.slam();shake=16;rumble(200,.8,.4);const ix=b.x+f*170;burst(ix,FLOOR,34,'#cbbfa8',420,{up:true,spread:60});burst(ix,FLOOR,12,'#ffd27a',500,{up:true,glow:true});
        const rel=(p.x-b.x)*f;if(rel>20&&rel<265)hurtPlayer(34,b.x);if(b.phase===2){wave(ix,1);wave(ix,-1)}}
      if(b.state==='leap'){if(first){b.sx=b.x;b.tx=clamp(p.x,LEFT+40,RIGHT-40);SFX.whoosh()}
        const u=(t-w)/A.act;b.x=lerp(b.sx,b.tx,u);b.y=-Math.sin(Math.PI*u)*280}

}
function txt(s,x,y,size,col,align,ls,font){g.font=`${size}px ${font||'Georgia,"Times New Roman",serif'}`;g.textAlign=align||'center';g.fillStyle=col;try{g.letterSpacing=(ls||0)+'px'}catch(e){}g.fillText(s,x,y)}
function bar(x,y,w,h,v,lag,col){g.fillStyle='rgba(0,0,0,.65)';g.fillRect(x-2,y-2,w+4,h+4);g.fillStyle='#2a2622';g.fillRect(x,y,w,h);
  g.fillStyle='#d8c36a';g.fillRect(x,y,w*clamp(lag,0,1),h);g.fillStyle=col;g.fillRect(x,y,w*clamp(v,0,1),h);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(x,y,w*clamp(v,0,1),h*.35);
  g.strokeStyle='#8f845f';g.lineWidth=1;g.strokeRect(x-2.5,y-2.5,w+5,h+5)}
function drawHUD(){
  const p=player,b=boss;
  bar(40,34,320,13,p.hp/100,p.hpLag/100,'#a01c1c');bar(40,56,250,9,p.st/100,p.st/100,'#3f8f4a');
  for(let i=0;i<4;i++){const fx=52+i*30,fy=92;g.fillStyle=i<p.flasks?'#ffb347':'#3a3229';if(i<p.flasks){g.shadowColor='#ff8a00';g.shadowBlur=10}
    g.beginPath();g.arc(fx,fy,9,0,7);g.fill();g.shadowBlur=0;g.fillRect(fx-3.5,fy-17,7,9);g.strokeStyle='#8f845f';g.lineWidth=1;g.beginPath();g.arc(fx,fy,9.5,0,7);g.stroke()}
  if(b.seen&&G.state!=='title'){const a=b.state==='dying'?1-clamp((b.t-2)/.8,0,1):1;g.save();g.globalAlpha=a;
    txt('Heraldo de la Zarza de Bronce',240,676,20,'#efe6cf','left',1);bar(240,686,800,11,b.hp/BOSS_HP,b.hpLag/BOSS_HP,'#9c1b1b');
    if(b.dmgShow>0)txt(String(Math.round(b.dmgShow)),1040,676,18,'#efe6cf','right',0);g.restore()}
  if(padName){txt('🎮 Mando conectado',W-36,40,14,'rgba(240,230,205,.7)','right',0,'system-ui,sans-serif')}
}
function overlay(){
  const pad=lastDev==='pad';
  if(G.state==='title'){g.fillStyle='rgba(5,3,2,.72)';g.fillRect(0,0,W,H);
    txt('LA ZARZA DE BRONCE',W/2,250,64,'#e9d6a4','center',10);txt('Un combate contra lo que despierta en la sala',W/2,292,20,'#b9a784','center',2);
    g.fillStyle='rgba(233,214,164,.4)';g.fillRect(W/2-220,318,440,1);
    const rows=[['Moverse','A / D  ·  ← →','Stick izq. / cruceta'],['Rodar (esquiva)','Espacio','B  /  A'],['Ataque ligero','J  ·  clic izq.','RB  /  X'],['Ataque pesado','K  ·  clic der.','RT  /  Y'],['Beber frasco','E','LB  /  cruceta ↑'],['Pausa','Esc','Start']];
    txt('TECLADO',W/2,362,13,'#8f845f','center',3,'system-ui,sans-serif');txt('MANDO',W/2+230,362,13,'#8f845f','center',3,'system-ui,sans-serif');
    rows.forEach((r,i)=>{const y=392+i*30;txt(r[0],W/2-140,y,18,'#d9ccb0','right',0);txt(r[1],W/2,y,17,'#f1e8d2','center',0,'system-ui,sans-serif');txt(r[2],W/2+230,y,17,'#f1e8d2','center',0,'system-ui,sans-serif')});
    if(Math.sin(time*3)>-.4)txt(pad?'Pulsa  A  o  START':'Pulsa  ENTER  (o  A  en el mando)',W/2,622,24,'#e9d6a4','center',3);
    txt(padName?'Mando detectado':'Conecta un mando y pulsa cualquier botón para activarlo',W/2,660,14,'rgba(200,190,165,.7)','center',0,'system-ui,sans-serif')}
  if(G.state==='dead'){const a=clamp((G.t-.5)/1.2,0,1);g.fillStyle=`rgba(0,0,0,${.6*a})`;g.fillRect(0,0,W,H);g.fillStyle=`rgba(0,0,0,${.7*a})`;g.fillRect(0,290,W,140);
    g.globalAlpha=a;txt('HAS MUERTO',W/2,382,78+a*8,'#9c1414','center',14);if(G.t>1.6)txt(pad?'Pulsa A para volver a intentarlo':'Pulsa ENTER para volver a intentarlo',W/2,470,20,'#cbbfa8','center',2);g.globalAlpha=1}
  if(G.state==='win'){const a=clamp(G.t/1.5,0,1);g.fillStyle=`rgba(0,0,0,${.6*a})`;g.fillRect(0,290,W,140);g.globalAlpha=a;g.shadowColor='#ffcf6a';g.shadowBlur=30;
    txt('HERALDO ABATIDO',W/2,382,70+a*8,'#f0d584','center',14);g.shadowBlur=0;if(G.t>3)txt(pad?'Pulsa A para continuar':'Pulsa ENTER para continuar',W/2,470,20,'#cbbfa8','center',2);g.globalAlpha=1}
  if(G.paused){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H);txt('PAUSA',W/2,H/2,60,'#e9d6a4','center',14)}
}
function draw(){
  g.setTransform(1,0,0,1,0,0);g.save();
  if(shake>.3)g.translate(rnd(-1,1)*shake,rnd(-1,1)*shake);
  g.drawImage(BG,0,0);
  const b=boss,p2=b.phase===2,awake=b.state==='statue'&&G.state==='intro'?clamp(b.t/1.6,0,1):0;
  if(p2||awake){g.save();g.globalCompositeOperation='lighter';g.globalAlpha=p2?(.55+.25*Math.sin(time*2.2))*(b.state==='dying'?1-clamp(b.t/2,0,1):1):awake*.6;g.drawImage(GLOW,0,0);g.restore()}
  drawHazWarn();
  const P=bossPose(b),fy=FLOOR+b.y;
  if(b.y>-200&&b.state!=='statue'){const s=clamp(1+b.y/400,.3,1);g.fillStyle=`rgba(0,0,0,${.32*s})`;g.beginPath();g.ellipse(b.x,FLOOR+4,80*s,11*s,0,0,7);g.fill()}
  const alpha=b.state==='dying'?1-clamp((b.t-1.9)/.9,0,1):1;
  if(alpha>0){const r=drawBoss(b.x,fy,b.state==='statue'?1:b.face,P,b.sc,{flash:b.flash,glow:p2?1:b.state==='dying'?1:awake,alpha});
    const A=ATK[b.state];if(A&&b.t>A.wind*b.wm*.55&&b.t<A.wind*b.wm){const k=Math.sin(((b.t/(A.wind*b.wm))-.55)/.45*Math.PI);g.save();g.globalCompositeOperation='lighter';g.strokeStyle=`rgba(255,240,200,${k})`;g.lineWidth=2.5;
      for(let i=0;i<4;i++){const a=i*Math.PI/4+time*2,L=22*k;g.beginPath();g.moveTo(r.tip[0]-Math.cos(a)*L,r.tip[1]-Math.sin(a)*L);g.lineTo(r.tip[0]+Math.cos(a)*L,r.tip[1]+Math.sin(a)*L);g.stroke()}g.restore()}}
  drawPlayer();drawHaz();
  for(const p of parts){const a=1-p.life/p.max;g.globalAlpha=a;if(p.glow){g.globalCompositeOperation='lighter'}g.fillStyle=p.col;g.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);g.globalCompositeOperation='source-over'}
  g.globalAlpha=1;
  if(p2&&G.state==='fight'){g.fillStyle='rgba(255,90,20,.06)';g.fillRect(0,0,W,H)}
  g.restore();
  g.drawImage(VIG,0,0);
  if(player.hp<35&&G.state==='fight'){g.fillStyle=`rgba(140,0,0,${.12+.06*Math.sin(time*5)})`;g.fillRect(0,0,W,H)}
  if(G.state!=='title')drawHUD();
  overlay();
}

/* ---------------- BUCLE ---------------- */
function update(dt){
  time+=dt;
  if(G.state==='title'){if(edge.start){audioInit();reset()}return}
  if(edge.pause&&(G.state==='fight'||G.state==='intro'))G.paused=!G.paused;
  if(G.paused)return;
  shake*=Math.pow(.004,dt);
  if(freeze>0){freeze-=dt;return}
  G.t+=dt;
  updPlayer(dt);updBoss(dt);updHaz(dt);updParts(dt);
  if(boss.phase===2&&G.state==='fight'&&Math.random()<.25)parts.push({x:rnd(100,1180),y:rnd(200,590),vx:rnd(-20,20),vy:rnd(-70,-30),life:0,max:rnd(1,2.2),col:'#ff9a3a',size:rnd(1.5,3),grav:-20,glow:true});
  if(droneG&&AC){const tgt=G.state==='fight'?.16:G.state==='intro'?.08:.03;droneG.gain.value+=(tgt-droneG.gain.value)*dt*2}
  if(G.state==='fight'){drumT-=dt;if(drumT<=0){drumT=boss.phase===2?.55:1.1;SFX.drum()}}
  if(G.state==='dead'&&G.t>1.6&&edge.start)reset();
  if(G.state==='win'&&G.t>3&&edge.start){reset();G.state='title'}
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.034,(now-last)/1000);last=now;
  pollInput();update(dt);draw();
  for(const k in edge)edge[k]=false;
  requestAnimationFrame(frame);
}
addEventListener('gamepadconnected',()=>{lastDev='pad'});
window.__dbg={get G(){return G},get player(){return player},get boss(){return boss},step(n,dt){for(let i=0;i<n;i++){update(dt||1/60);for(const k in edge)edge[k]=false}draw()},edge,inp};
requestAnimationFrame(frame);
</script>
